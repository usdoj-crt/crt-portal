{% comment %}
<!--
US map widget — renders a single interactive map of the United States.

Usage (include once per map you want on the page):

    {% include "partials/map_widget.html" with data_name="example-map" %}

You must ALSO include the shared assets once per page (see
"partials/map_widget_assets.html"), which loads the CSS, d3, and the widget JS.
The widget JS boots every ".map-widget" element on the page, so multiple
includes of this partial render multiple independent maps.

Arguments
---------
Required:
  data_name                    Unique name of a MapWidgetData record (editable in
                               the Django admin). The widget fetches its JSON from
                               the server by this name, so the map's data can be
                               changed without a code redeployment.

Optional (fall back to the widget's built-in defaults if omitted):
  map_classes                  Extra CSS classes added to the widget container.

  map_default_fill_color       Resting fill for states. Defaults to "#3498db".

  map_active_fill_color        Fill for the hovered/selected state. Defaults to
                               "#f4c430".

  map_stroke_color             Border color. Defaults to "#ffffff".

  map_stroke_width             Border width. Defaults to "1".

  badge_text_color             Text color for the DC badge label. Defaults to
                               "#ffffff".

  badge_radius                 Radius of the DC badge circle. Defaults to "16".

  show_tooltip                 When "true", a small tooltip follows the cursor
                               while hovering a feature, showing its name and
                               code. Defaults to "false".

  show_category_bar            When "true", a bar is shown below the map that
                               breaks down the selected feature's actions by
                               category. The set of categories is derived from
                               the data (the "category" field on each action)
                               and ordered alphabetically. Actions without a
                               category are ignored. Defaults to "false".

  category_bar_caption         Optional static caption text shown in the
                               category bar header (e.g. "enforcement actions
                               by type").

  category_bar_caption_classes CSS classes applied to the caption text span
                               (the category_bar_caption text).

  caption_state_text           Optional prefix shown before the caption text,
                               with {state} replaced by the selected feature's
                               name (e.g. "{state}" or "{state}:"). Rendered in
                               its own span for independent styling. Omit to hide.

  caption_state_classes     CSS classes applied to the caption_state_text
                               span (e.g. "text-gold").

  category_bar_total_label     Optional label shown to the right of the caption,
                               alongside the selected feature's total action
                               count (e.g. "Total"). Omit to hide the total.

  category_bar_total_label_classes
                               CSS classes applied to the total label.

  category_bar_total_count_classes
                               CSS classes applied to the total count (number).

  category_slot_label_classes
                               CSS classes applied to each category slot's label
                               (the category name) in the breakdown bar.

  category_slot_count_classes
                               CSS classes applied to each category slot's count
                               (the number) in the breakdown bar.

  category_slot_empty_label_classes
                               CSS classes for a category slot's label span when
                               its count is zero. When set, these REPLACE
                               category_slot_label_classes on empty slots (the
                               base map-widget__category-slot-label class is kept),
                               so the empty styling always wins with no cascade
                               conflict. Falls back to the normal label classes
                               when unset.

  category_slot_empty_count_classes
                               Same as above, but for a category slot's count span
                               (replaces category_slot_count_classes on empty
                               slots).

  badge_mapping                Path (relative to the static root) to a JSON file
                               mapping agency codes to badge image URLs. When an
                               agency is found in the mapping its image is used;
                               otherwise the text badge is used as a fallback.
  info_placeholder_text        Info-panel text before a state is selected,
                               shown on devices that support hover. Defaults to
                               "Hover or Click a feature to view details".
  info_placeholder_text_no_hover
                               Info-panel text before a state is selected,
                               shown on tap/click-only devices (no hover).
                               Defaults to "Click a feature to view details".

  info_heading_classes         CSS classes for the info-panel heading.

  info_subheading_text         Optional info-panel subheading, shown below the
                               heading/pill and above the separator. Supports the
                               {state} placeholder (replaced with the selected
                               state's name). Omitted when empty.

  info_subheading_classes      CSS classes for the info-panel subheading.

  info_list_classes            CSS classes for the info-panel list.

  info_list_item_classes       CSS classes for the info-panel list items.

  info_action_text_classes     CSS classes for each action's description text.

  info_action_date_classes     CSS classes for each action's formatted date.

  info_no_data_text            Text shown when a state has no data. Defaults to
                               "No Data".

  info_no_data_paragraph_classes
                                  CSS classes for the "no data" paragraph.

  info_max_items               The maximum number of items to render

  info_overflow_text           If max number of items is exceeded, this text is displayed below

  info_overflow_classes        CSS classes for the overflow text paragraph.
-->
{% endcomment %}
<div
  class="map-widget {{ map_classes|default:'' }}"
  data-geojson-urls="{% static 'data/map-widget/regions/contiguous.geojson' %},{% static 'data/map-widget/regions/alaska.geojson' %},{% static 'data/map-widget/regions/hawaii.geojson' %}"
  data-data-src="{% url 'map_widget:data' name=data_name %}"
  data-badge-mapping-src="{% if badge_mapping %}{% static badge_mapping %}{% endif %}"
  data-map-default-fill-color="{{ map_default_fill_color|default:'' }}"
  data-map-active-fill-color="{{ map_active_fill_color|default:'' }}"
  data-map-stroke-color="{{ map_stroke_color|default:'' }}"
  data-map-stroke-width="{{ map_stroke_width|default:'' }}"
  data-map-badge-text-color="{{ badge_text_color|default:'' }}"
  data-map-badge-radius="{{ badge_radius|default:'' }}"
  data-map-show-tooltip="{{ show_tooltip|default:'false'}}"
  data-map-show-category-bar="{{ show_category_bar|default:'false' }}"
  data-map-category-bar-caption="{{ category_bar_caption|default:'' }}"
  data-map-category-bar-caption-classes="{{ category_bar_caption_classes|default:'' }}"
  data-map-category-bar-total-label="{{ category_bar_total_label|default:'' }}"
  data-map-category-bar-total-label-classes="{{ category_bar_total_label_classes|default:'' }}"
  data-map-category-bar-total-count-classes="{{ category_bar_total_count_classes|default:'' }}"
  data-map-caption-state-text="{{ caption_state_text|default:'' }}"
  data-map-caption-state-classes="{{ caption_state_classes|default:'' }}"
  data-map-category-slot-label-classes="{{ category_slot_label_classes|default:'' }}"
  data-map-category-slot-count-classes="{{ category_slot_count_classes|default:'' }}"
  data-map-category-slot-empty-label-classes="{{ category_slot_empty_label_classes|default:'' }}"
  data-map-category-slot-empty-count-classes="{{ category_slot_empty_count_classes|default:'' }}"
  data-info-panel-placeholder-text="{{ info_placeholder_text|default:'Hover or Click a feature to view details' }}"
  data-info-panel-placeholder-text-no-hover="{{ info_placeholder_text_no_hover|default:'Click a feature to view details' }}"
  data-info-panel-heading-classes="{{ info_heading_classes|default:'' }}"
  data-info-panel-subheading-text="{{ info_subheading_text|default:'' }}"
  data-info-panel-subheading-classes="{{ info_subheading_classes|default:'' }}"
  data-info-panel-list-classes="{{ info_list_classes|default:'' }}"
  data-info-panel-list-item-classes="{{ info_list_item_classes|default:'' }}"
  data-info-panel-action-text-classes="{{ info_action_text_classes|default:'' }}"
  data-info-panel-action-date-classes="{{ info_action_date_classes|default:'' }}"
  data-info-panel-no-data-text="{{ info_no_data_text|default:'No Data' }}"
  data-info-panel-no-data-paragraph-classes="{{ info_no_data_paragraph_classes|default:'' }}"
  data-info-panel-max-items="{{ info_max_items|default:'' }}"
  data-info-panel-overflow-text="{{ info_overflow_text|default:'' }}"
  data-info-panel-overflow-classes="{{ info_overflow_classes|default:'' }}"
  data-info-panel-sort-order="{{ info_sort_order|default:'desc' }}"
></div>
