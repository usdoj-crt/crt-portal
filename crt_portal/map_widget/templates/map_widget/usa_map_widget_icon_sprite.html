{% comment %}
<!--Inline icon sprite for the USA map widget's category stat icons.

Included once (hidden) by usa_map_widget_assets.html so stat blocks can render
their icons as <svg><use href="#icon-<slug>"></svg>. The symbols are inlined in
the document (not referenced as an external file) so:
  - `currentColor` works, letting CSS recolor each icon per surface (navy in the
    panel, white on the bar); and
  - there's no per-state markup bloat in the JSON data (each stat carries only a
    short slug) and no external-file/CSP fetch concerns.

Each symbol is a single-color line glyph on a 0 0 24 24 viewBox. Paths carry no
fill/stroke of their own; those come from CSS (.usa-map-widget__stat-icon), which
sets fill:none, stroke:currentColor.-->
{% endcomment %}
