{% comment %}
<!--
News column widget — renders the <ul> list of articles for a single news
column (e.g. the DOJ or DHS column on the Election Integrity page).

This partial is rendered by the `render_news_column` inclusion tag (see
news_widget/templatetags/news_column.py), which loads the article list from an
admin-editable NewsWidgetColumnData record and passes it in. Use the tag rather
than including this partial directly:

    {% load news_column %}
    {% render_news_column "doj-election-news" labelledby="news-doj-h" %}

This partial renders ONLY the <ul> of article items. The surrounding column
wrapper, agency seal, heading, and "View all" link stay in the parent template.

Context variables (supplied by the tag)
---------------------------------------
  items         A list of article objects. Each item is expected to have:
                  date   Display date string, e.g. "Feb 26, 2026".
                  title  The article title/link text.
                  link   The absolute URL the title links to.
                The list comes from a NewsWidgetColumnData record (editable in
                the Django admin), so the column's articles can be changed
                without a code redeployment.

  labelledby    The id of the column's heading element, used for the <ul>'s
                aria-labelledby attribute so the list is associated with its
                heading for assistive technology.
-->
{% endcomment %}
<ul class="usa-list usa-list--unstyled margin-0"{% if labelledby %} aria-labelledby="{{ labelledby }}"{% endif %}>
    {% for item in items %}
    <li class="simplenews__item padding-y-3 margin-x-2">
        <span class="simplenews__date display-block text-bold text-uppercase font-body-3xs text-ls-1">{{ item.date }}</span>
        <a class="simplenews__link external-link--blue text-primary-darker text-no-underline"
            href="{{ item.link }}"
            rel="noopener">{{ item.title }}</a>
    </li>
    {% endfor %}
</ul>
