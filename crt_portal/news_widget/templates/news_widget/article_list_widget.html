{% comment %}
Admin widget template for editing a news column's article list.

The <textarea> below holds the real JSON value that is submitted and saved.
`news_column_admin.js` finds this widget (via the data-* hooks) and progressively
enhances it into a friendly add / remove / reorder editor. If JavaScript is
unavailable, the raw JSON textarea is still fully editable on its own.
{% endcomment %}
<div class="news-article-editor" data-news-article-editor>
  <div class="news-article-editor__rows" data-news-article-rows></div>
  <div class="news-article-editor__actions">
    <button type="button" class="button" data-news-article-add>+ Add article</button>
    <button type="button" class="button news-article-editor__raw-toggle" data-news-article-toggle-raw>Show raw JSON</button>
  </div>
  <textarea
    name="{{ widget.name }}"{% if widget.attrs.id %}
    id="{{ widget.attrs.id }}"{% endif %}
    class="news-article-editor__json"
    data-news-article-json
  >{% if widget.value %}{{ widget.value }}{% endif %}</textarea>
</div>
