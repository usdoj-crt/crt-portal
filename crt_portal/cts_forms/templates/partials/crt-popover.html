<span class="crt-popover">
  <button type="button"
          class="crt-popover__trigger {{ trigger_styles }}"
          id="{{ trigger_id }}"
          aria-expanded="false"
          aria-describedby="{{ popover_id }}">
    {{ trigger_label }}
  </button>
  <span class="crt-popover__content" id="{{ popover_id }}" hidden>
    {% block crt_popover_content %}{% endblock %}
  </span>
</span>
