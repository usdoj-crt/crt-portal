<div id="llm-chat-widget"
     class="position-fixed bottom-3 right-3 z-500"
     data-report-id="{{ report_id }}"
     data-csrf-token="{{ csrf_token }}"
     data-chat-url="{% url 'crt_forms:llm-chat' %}"
     data-summarize-url="{% url 'crt_forms:llm-summarize-reports' %}"
     hidden>
  <button id="llm-chat-toggle" class="usa-button circle-6 margin-0 padding-0" aria-label="Open chat" title="Chat with LLM">
      <svg class="usa-icon usa-icon--size-3 text-white" aria-hidden="true" focusable="false">
        <use href="/static/img/sprite.svg#chat"></use>
      </svg>
  </button>
  <div id="llm-chat-panel" class="display-flex flex-column position-absolute bottom-full right-0 margin-bottom-1 bg-white radius-lg shadow-3" hidden>
    <div id="llm-chat-top" class="display-flex flex-column flex-1 minh-0 overflow-hidden">
        <div id="llm-chat-resize" class="position-absolute top-0 left-0" aria-hidden="true">
        <svg class="usa-icon text-white" aria-hidden="true" focusable="false">
            <use href="/static/img/sprite.svg#drag_handle"></use>
        </svg>
        </div>
        <div id="llm-chat-heading" class="display-flex flex-justify padding-2 bg-primary-darker text-white radius-top-lg">
            <span>(Insert some clever AI name here)</span>
            <button id="llm-chat-close" class="usa-button usa-button--unstyled text-white text-no-underline" aria-label="Close chat">X</button>
        </div>
        <div id="llm-chat-messages" class="margin-2 flex-1 minh-0 overflow-y-auto"></div>
    </div>
    <div id="llm-chat-bottom">
        <div id="llm-chat-quick-actions" class="padding-x-2 padding-y-1" hidden>
            <button id="llm-chat-summarize" class="display-flex flex-align-center flex-justify-center usa-button usa-button--outline height-2" type="button">
                <img class="usa-icon margin-right-1" aria-hidden="true" focusable="false" src="/static/img/sparkles-outline.svg"></img>
                <span class="llm-chat-summarize-text">Summarize this report</span>
            </button>
            <button id="llm-chat-summarize-multiple" class="display-flex flex-align-center flex-justify-center usa-button usa-button--outline height-2 margin-top-05" type="button" hidden>
                <img class="usa-icon margin-right-1" aria-hidden="true" focusable="false" src="/static/img/sparkles-outline.svg"></img>
                <span class="llm-chat-summarize-multiple-text">Summarize &amp; compare selected reports</span>
            </button>
        </div>
        <div id="llm-chat-input-panel" class="display-flex padding-2 border-top-1px border-base-lighter">
            <textarea id="llm-chat-input" class="usa-textarea margin-top-0 margin-right-2" placeholder="Type a message..." rows="1"></textarea>
            <div class="display-flex flex-align-end">
                <button id="llm-chat-send" class="usa-button margin-0">Send</button>
            </div>
        </div>
    </div>
  </div>
</div>
