<div id="llm-chat-widget" class="position-fixed bottom-3 right-3 z-500" hidden>
  <button id="llm-chat-toggle" class="usa-button circle-6 margin-0 padding-0" aria-label="Open chat" title="Chat with LLM">
      <svg class="usa-icon usa-icon--size-3 text-white" aria-hidden="true" focusable="false">
        <use href="/static/img/sprite.svg#chat"></use>
      </svg>
  </button>
  <div id="llm-chat-panel" class="display-flex flex-column flex-justify position-absolute bottom-full right-0 margin-bottom-1 bg-white radius-lg shadow-3" hidden>
    <div>
        <div id="llm-chat-resize" class="position-absolute top-0 left-0 square-3" aria-hidden="true">
        <svg class="usa-icon text-white" aria-hidden="true" focusable="false">
            <use href="/static/img/sprite.svg#arrow_drop_up"></use>
        </svg>
        </div>
        <div id="llm-chat-heading" class="display-flex flex-justify padding-2 bg-primary-darker text-white radius-top-lg">
            <span>AI</span>
            <button id="llm-chat-close" class="usa-button usa-button--unstyled text-white text-no-underline" aria-label="Close chat">X</button>
        </div>
        <div id="llm-chat-messages" class="margin-2"></div>
    </div>
    <div>
        <div id="llm-chat-quick-actions" class="padding-x-2 padding-y-1" hidden>
            <button id="llm-chat-summarize" class="display-flex flex-align-center flex-justify-center usa-button usa-button--outline height-2" type="button">
                &#10024; Summarize this report
            </button>
        </div>
        <div id="llm-chat-input-panel" class="display-flex padding-2 border-top-1px border-base-lighter">
            <textarea id="llm-chat-input" class="usa-textarea margin-top-0 margin-right-2" placeholder="Type a message..." rows="1"></textarea>
            <div class="display-flex flex-align-end">
                <button id="llm-chat-send" class="usa-button margin-0">Send</button>
            </div>
        </div>
    </div>
  </div>
</div>
